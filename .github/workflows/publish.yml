name: publish

# Puts a new version on PyPI when a release is published on GitHub, so `uv tool install pressling` gets it.
# It signs in to PyPI as this workflow (trusted publishing): no password or token is stored anywhere.

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the release is named after the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          code=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/music_curator/__init__.py').read())[1])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "The release is $GITHUB_REF_NAME but pyproject.toml says $version"; exit 1; }
          test "$version" = "$code" || { echo "pyproject.toml says $version but __init__.py says $code"; exit 1; }
      - name: Build
        run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
