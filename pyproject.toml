[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-curator"
version = "0.1.0"
description = "Curate a local music library: verify songs against Discogs and other sources, settle versions by length and audio fingerprints, write clean tags and covers."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = []          # standard library only; ffmpeg (with chromaprint) must be on PATH

[project.optional-dependencies]
compare = ["yt-dlp"]       # only to compare your files with videos online; nothing it fetches is kept

[project.scripts]
curator = "music_curator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_curator = ["web/*"]
